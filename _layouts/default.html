<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang }}">
<head>
  <meta charset="utf-8">  
  <meta name="viewport" content="width=device-width, initial-scale=1">  
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#121212">
  <meta name="color-scheme" content="dark light">

  {% seo %}
  
  <link rel="icon" href="{{ '/assets/logo.png' | relative_url }}" type="image/png">
  <link rel="apple-touch-icon" href="{{ '/assets/logo.png' | relative_url }}">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@latest/css/all.min.css">
  
  <style>
    * { 
      box-sizing: border-box;
    }
    html {
      scrollbar-gutter: stable;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
    }
  </style>
  
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-746R2BN26S"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-746R2BN26S');
  </script>
  
  {% include schema.html %}
</head>
<body>
  {{ content }}

  {% include menu.html %}
  {% include footer.html %}
  <script src="{{ '/script.js' | relative_url }}"></script>
</body>
</html>
